<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>GitSwitch 原型 v3</title>
<style>
  :root {
    --bg:#14161a; --cell:#1b1e24; --cell2:#21252d; --line:#2b3038;
    --text:#e6e8ec; --muted:#8b93a1; --dim:#656d7b;
    --accent:#5b9dff; --accent-soft:rgba(91,157,255,.14);
    --ok:#46c88b; --warn:#e0a33e; --red:#e8607a; --add:#3fbf7f; --del:#e8607a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);overflow:hidden;
    font:13px/1.5 -apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .win{height:100vh;display:grid;grid-template-rows:46px 1fr auto}

  /* ---------- 顶栏 ---------- */
  header{display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#1a1e25,#171a20)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;flex:none}
  .logo{width:21px;height:21px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent),#7d6bff);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 6px 16px -6px var(--accent)}
  .logo svg{width:12px;height:12px}
  .search{position:relative;width:250px;flex:none}
  .search input{width:100%;height:28px;padding:0 9px 0 27px;border-radius:8px;background:#12151a;border:1px solid var(--line);color:var(--text);font-size:12.5px;outline:none}
  .search input:focus{border-color:#3d6ea8;box-shadow:0 0 0 3px var(--accent-soft)}
  .search svg{position:absolute;left:8px;top:8px;width:13px;height:13px;opacity:.45}
  .spacer{flex:1}
  .btn{
    height:28px;padding:0 11px;border-radius:8px;cursor:pointer;font-size:12.5px;white-space:nowrap;flex:none;
    border:1px solid var(--line);background:var(--cell2);color:var(--text);
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{background:#272c35}
  .btn.primary{background:linear-gradient(180deg,#3f81e8,#2f6dd0);border-color:#2b62bd}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.sm{height:24px;padding:0 8px;font-size:11.5px;border-radius:6px}
  .btn.wide{width:100%;justify-content:center;height:32px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* ---------- 三栏 ---------- */
  .cols{display:grid;grid-template-columns:262px 292px minmax(0,1fr);min-height:0}
  .col{display:flex;flex-direction:column;min-height:0;min-width:0}
  .platforms{border-right:1px solid var(--line);background:linear-gradient(180deg,#171a20,#15181d)}
  .projects{border-right:1px solid var(--line);background:#16191f}
  .col-head{height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);flex:none}
  .col-head .n{color:var(--muted);text-transform:none;letter-spacing:0;font-size:10.5px}
  .col-foot{border-top:1px solid var(--line);padding:9px;flex:none}
  .ghost{width:100%;height:32px;border-radius:8px;cursor:pointer;font-size:12.5px;background:transparent;border:1px dashed #333a45;color:var(--muted)}
  .ghost:hover{border-color:#4a5464;color:var(--text)}
  .scroll{overflow:auto;flex:1;min-height:0;padding:6px 8px}

  /* 平台树（只有 平台 → 账号） */
  .plat-row{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12.5px}
  .plat-row:hover{background:#1e232a}
  .plat-row.sel{background:#202833}
  .caret-s{width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-top:4.5px solid #7b8496;transition:transform .15s;margin-left:4px;flex:none}
  .caret-s.open{transform:rotate(180deg)}
  .badge{font-size:10.5px;color:var(--dim);white-space:nowrap}
  .acct-row{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:6px 8px 6px 14px;border-radius:8px;cursor:pointer;font-size:12.5px}
  .acct-row:hover{background:#1e232a}
  .acct-row.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 1px #31587f}
  .avatar{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:600;background:#2c3f5c;color:#b9d2f5;border:1px solid #3b5d86;flex:none}
  .acct-label{display:flex;flex-direction:column;min-width:0}
  .acct-label small{font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:9.5px;font-weight:700;flex:none}
  .dot.gh{background:#2c3138;color:#fff}
  .dot.gl{background:#fc6d26;color:#fff}
  .dot.gitee{background:#c71d23;color:#fff}
  .dot.corp{background:#4a5f8a;color:#fff}

  /* 中栏 */
  .plist{padding:8px;display:flex;flex-direction:column;gap:6px}
  .pcard{border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;background:linear-gradient(180deg,#1c2027,#1a1e24)}
  .pcard:hover{border-color:#39414f}
  .pcard.sel{border-color:#3d6ea8;box-shadow:0 0 0 2px var(--accent-soft)}
  .pcard .pn{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
  .pcard .pu{font-size:10.5px;color:var(--dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pcard .pmeta{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .chip{font-size:10px;padding:1px 6px;border-radius:20px;background:#23282f;color:var(--muted);border:1px solid var(--line)}
  .chip.blue{background:var(--accent-soft);color:#9dc4ff;border-color:#31587f}
  .chip.ok{background:rgba(70,200,139,.1);color:#7fd7ac;border-color:rgba(70,200,139,.3)}

  /* 右栏 */
  .detail{background:#191c22}
  .dhead{padding:11px 16px 0;flex:none}
  .dtitle{display:flex;align-items:center;gap:8px;min-width:0}
  .dtitle h2{font-size:15px;margin:0;font-weight:600;white-space:nowrap}
  .tag{font-size:10.5px;padding:1.5px 7px;border-radius:20px;background:#23282f;color:var(--muted);border:1px solid var(--line);white-space:nowrap}
  .tag.blue{background:var(--accent-soft);color:#9dc4ff;border-color:#31587f}
  .mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim)}
  .dpath{margin:4px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .plat-row.open{background:#1a1e25}
  .switcher{display:grid;grid-template-columns:1fr 1.25fr auto;gap:10px;align-items:end;padding:11px 16px 9px;flex:none}
  .label{font-size:10px;color:var(--dim);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
  .combo{position:relative}
  .sel-t{height:30px;width:100%;padding:0 9px;border-radius:8px;cursor:pointer;background:#12151a;border:1px solid var(--line);color:var(--text);font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .sel-t:hover{border-color:#3a4250}
  .sel-t.open{border-color:#3d6ea8;box-shadow:0 0 0 3px var(--accent-soft)}
  .caret{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #7b8496;transition:transform .15s;flex:none}
  .sel-t.open .caret{transform:rotate(180deg)}
  .menu{position:absolute;z-index:40;left:0;right:0;top:35px;display:none;background:#202530;border:1px solid #333a48;border-radius:9px;padding:5px;box-shadow:0 18px 40px -12px #000}
  .menu.show{display:block;animation:pop .12s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .opt{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12.5px}
  .opt:hover{background:#2a3040}
  .opt.sel{background:var(--accent-soft)}
  .opt .meta{font-size:10px;color:var(--dim)}
  .menu-head{font-size:10px;color:var(--dim);padding:3px 8px 5px}
  .seg{display:inline-flex;background:#12151a;border:1px solid var(--line);border-radius:8px;padding:2px}
  .seg button{height:24px;padding:0 10px;border:0;border-radius:6px;cursor:pointer;background:transparent;color:var(--muted);font-size:11.5px;white-space:nowrap}
  .seg button.on{background:#2a3140;color:#dfe7f5;box-shadow:inset 0 0 0 1px #3a4453}

  /* git 操作栏 */
  .gitbar{display:flex;align-items:center;gap:6px;padding:0 16px 9px;flex:none;flex-wrap:wrap}
  .gitbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .gitbar .branch{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:7px;background:#12151a;border:1px solid var(--line);font-size:11.5px;color:#cfe0ff;cursor:pointer}
  .gitbar .branch svg{width:11px;height:11px;opacity:.7}

  /* tabs */
  .tabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line);flex:none}
  .tab{padding:8px 12px;font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tab:hover{color:var(--text)}
  .tab.on{color:#cfe0ff;border-bottom-color:var(--accent)}
  .tab .cnt{font-size:10px;padding:0 5px;border-radius:20px;background:#2b3038;color:var(--muted);margin-left:5px}

  .pane{overflow:auto;flex:1;min-height:0;padding:14px 16px 16px}
  .pane.flush{padding:0;overflow:hidden;display:flex}

  /* README */
  .readme h3{font-size:13px;margin:16px 0 6px;color:#dbe4f3}
  .readme h3:first-child{margin-top:0}
  .readme p{margin:6px 0;color:#b9c1cf;font-size:12.5px;line-height:1.75}
  .readme code{font-family:"SF Mono",ui-monospace,monospace;font-size:11.5px;background:#23282f;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:#cbd6e6}
  .readme pre{background:#12151a;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-family:"SF Mono",ui-monospace,monospace;font-size:11.5px;color:#a9b6c9;overflow:auto;margin:8px 0}
  .readme ul{margin:6px 0;padding-left:18px;color:#b9c1cf;font-size:12.5px}
  .readme li{margin:3px 0}

  /* git 记录 */
  .commit{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:7px}
  .commit:hover{background:#20242b}
  .commit .h{font-family:ui-monospace,monospace;font-size:10.5px;color:#7f8ea3}
  .commit .m{font-size:12.5px;color:#dbe1ea;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .commit .m small{color:var(--dim);font-size:10.5px;margin-left:6px}
  .commit .d{font-size:10.5px;color:var(--dim);white-space:nowrap}

  /* 本地文件：左树 + 右编辑器 */
  .fview{display:grid;grid-template-columns:216px minmax(0,1fr);flex:1;min-height:0}
  .ftree{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#171a20}
  .ftree-head{padding:7px 10px;font-size:10.5px;color:var(--dim);letter-spacing:.6px;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
  .ftree-body{overflow:auto;flex:1;min-height:0;padding:5px 6px}
  .frow{display:grid;grid-template-columns:13px 1fr auto;gap:6px;align-items:center;padding:4px 6px 4px calc(6px + var(--ind,0px));border-radius:6px;cursor:pointer;font-size:12px;color:#c3ccda}
  .frow:hover{background:#1f242b}
  .frow.sel{background:#233043;color:#dbe9ff}
  .frow .fic{width:12px;height:12px;opacity:.5;flex:none}
  .frow.dir{color:#9dc4ff}
  .frow .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st{font-size:9.5px;font-weight:700;width:13px;text-align:center;border-radius:3px;font-family:ui-monospace,monospace}
  .st.M{color:#e0a33e}
  .st.A{color:#46c88b}
  .st.D{color:#e8607a}
  .st.R{color:#9d8bff}
  .st.U{color:#5b9dff}

  .fmain{display:flex;flex-direction:column;min-width:0;min-height:0}
  .fbar{display:flex;align-items:center;gap:7px;padding:6px 10px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
  .fbar .fpath{font-size:12px;color:#cdd6e3;font-family:"SF Mono",ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .fcode{overflow:auto;flex:1;min-height:0;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11.5px;line-height:20px}

  /* 代码行 */
  .cl{display:grid;grid-template-columns:var(--blame-w,0px) 46px 1fr;align-items:stretch;white-space:pre}
  .cl:hover{background:#1f232a}
  .blame{color:#5d6675;font-size:10px;padding-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid #23282f;line-height:20px}
  .ln{color:#4d5563;text-align:right;padding-right:10px;user-select:none;line-height:20px}
  .ct{padding-right:14px;color:#c9d4e4;line-height:20px}
  .ct .kw{color:#c792ea} .ct .str{color:#a8d08d} .ct .cm{color:#5c6674;font-style:italic}
  .ct .num{color:#e0a33e} .ct .ann{color:#7fb2ff} .ct .ty{color:#4ec9b0}

  /* diff */
  .dwrap{overflow:auto;flex:1;min-height:0;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11.5px;line-height:20px}
  .dside{display:grid;grid-template-columns:1fr 1fr}
  .dhalf{border-right:1px solid var(--line);min-width:0}
  .dhalf:last-child{border-right:0}
  .dhalf-head{position:sticky;top:0;background:#1d222a;border-bottom:1px solid var(--line);padding:4px 10px;font-size:10.5px;color:var(--muted);z-index:2}
  .dline{display:grid;grid-template-columns:40px 1fr;white-space:pre}
  .dline .dl{color:#4d5563;text-align:right;padding-right:8px;user-select:none}
  .dline .dt{padding-right:12px;color:#c9d4e4}
  .dline.add{background:rgba(63,191,127,.1)}
  .dline.add .dt{color:#a8e6c4}
  .dline.del{background:rgba(232,96,122,.1)}
  .dline.del .dt{color:#f0b3c0}
  .dline.empty .dt{color:transparent}

  /* 底部终端 */
  .term{border-top:1px solid var(--line);background:#14171c;display:flex;flex-direction:column;height:168px;transition:height .12s ease}
  .term.collapsed{height:33px}
  .term-head{display:flex;align-items:center;gap:3px;padding:0 10px;height:32px;flex:none;border-bottom:1px solid var(--line)}
  .term-tab{padding:4px 10px;font-size:11.5px;color:var(--muted);cursor:pointer;border-radius:6px}
  .term-tab:hover{background:#1e232a}
  .term-tab.on{color:#dfe7f5;background:#20252d}
  .term-body{flex:1;min-height:0;overflow:auto;padding:7px 12px;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.7;color:#aab4c4}
  .term-body .cmd{color:#7fd7ac}
  .term-body .cmd::before{content:"$ ";color:#5d6675}
  .term-body .out{color:#8b93a1;white-space:pre-wrap}
  .term-body .ok{color:#46c88b}
  .term-body .er{color:#e8607a}

  .dfoot{display:flex;align-items:center;gap:9px;padding:8px 16px;border-top:1px solid var(--line);flex:none}
  .status{font-size:12px;color:var(--ok);display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .2s}
  .status.show{opacity:1}
  .warnline{display:flex;gap:8px;align-items:center;font-size:11.5px;color:#e8c68b;background:rgba(224,163,62,.07);border:1px solid rgba(224,163,62,.25);border-radius:7px;padding:6px 9px;margin:0 16px 8px;flex:none}
  .empty{color:var(--dim);font-size:12.5px;text-align:center;padding:40px 0}
  .dirty-mark{color:var(--warn);font-size:11px}
</style>
</head>
<body>
<div class="win">
  <header>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
          <circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="12" r="2.4"/>
          <path d="M6 8.4v7.2M8.4 6h5.5a4 4 0 0 0 4 4"/>
        </svg>
      </div>
      GitSwitch
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
      <input placeholder="搜索平台 / 账号 / 项目…" />
    </div>
    <div class="spacer"></div>
    <button class="btn">扫描本地仓库</button>
    <button class="btn">读取 git 远程</button>
  </header>

  <div class="cols">
    <!-- 左栏：平台 → 账号（不含项目） -->
    <aside class="col platforms">
      <div class="col-head"><span>平台</span><span class="n" id="platCount"></span></div>
      <div class="scroll" id="tree"></div>
      <div class="col-foot"><button class="ghost">+ 添加平台及账号</button></div>
    </aside>

    <!-- 中栏：该平台该账号的项目 -->
    <section class="col projects">
      <div class="col-head"><span id="projHead">项目</span><span class="n" id="projCount"></span></div>
      <div class="scroll" style="padding:0"><div class="plist" id="plist"></div></div>
      <div class="col-foot"><button class="btn primary wide" id="cloneBtn">克隆</button></div>
    </section>

    <!-- 右栏：详情 + git 操作 + 文件 + 编辑器 -->
    <main class="col detail">
      <div class="dhead">
        <div class="dtitle">
          <h2 id="dName">iot-gateway</h2>
          <span class="tag blue" id="dPlat">GitHub</span>
          <span class="tag" id="dProto">SSH</span>
          <span class="tag" id="dBranch">main</span>
          <span class="spacer"></span>
          <span class="mono" id="dPath"></span>
        </div>
        <div class="mono dpath" id="dUrl"></div>
      </div>

      <div class="switcher">
        <div>
          <div class="label">平台</div>
          <div class="combo">
            <div class="sel-t" data-menu="platMenu">
              <span style="display:flex;align-items:center;gap:7px;min-width:0">
                <span class="dot gh" style="width:15px;height:15px;font-size:9px" id="sPlatDot">G</span>
                <span id="sPlatName" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">GitHub</span>
              </span>
              <i class="caret"></i>
            </div>
            <div class="menu" id="platMenu"></div>
          </div>
        </div>
        <div>
          <div class="label">账号 · 该平台下可供切换</div>
          <div class="combo">
            <div class="sel-t" data-menu="acctMenu">
              <span style="display:flex;align-items:center;gap:7px;min-width:0">
                <span class="avatar" id="sAcctAv">张</span>
                <span id="sAcctName" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">张鑫宇 · 个人</span>
              </span>
              <i class="caret"></i>
            </div>
            <div class="menu" id="acctMenu"></div>
          </div>
        </div>
        <div>
          <div class="label">认证</div>
          <div class="seg" id="authSeg">
            <button class="on" data-auth="ssh">SSH</button>
            <button data-auth="token">令牌</button>
          </div>
        </div>
      </div>

      <!-- git 操作 -->
      <div class="gitbar">
        <div class="branch" id="branchBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="12" r="2.2"/><path d="M6 8.2v7.6M8.2 6H14a4 4 0 0 1 4 4"/></svg>
          <span id="branchName">main</span>
        </div>
        <button class="btn sm" data-act="fetch">获取</button>
        <button class="btn sm" data-act="pull">拉取</button>
        <button class="btn sm primary" data-act="push">推送</button>
        <span class="sep"></span>
        <button class="btn sm" data-act="commit">提交</button>
        <button class="btn sm" data-act="stash">贮藏</button>
        <button class="btn sm" data-act="branch">分支</button>
        <button class="btn sm" data-act="merge">合并</button>
        <button class="btn sm" data-act="rebase">变基</button>
        <button class="btn sm" data-act="reset">重置</button>
        <span class="sep"></span>
        <button class="btn sm" data-act="tag">标签</button>
        <button class="btn sm" data-act="log">日志</button>

function highlight(code, lang){
  let s = esc(code);
  if (lang==="java"){
    s = s.replace(/(\/\/[^\n]*)/g,'<span class="cm">$1</span>')
         .replace(/(&quot;[^&]*?&quot;)/g,'<span class="str">$1</span>')
         .replace(/"[^"]*"/g, m=>`<span class="str">${m}</span>`)
         .replace(/\b(package|import|public|private|class|return|new|void|int|boolean|final)\b/g,'<span class="kw">$1</span>')
         .replace(/\b(\d+)\b/g,'<span class="num">$1</span>')
         .replace(/(@\w+)/g,'<span class="ann">$1</span>');
  } else if (lang==="xml"){
    s = s.replace(/(&lt;\/?[\w:.-]+)/g,'<span class="kw">$1</span>')
         .replace(/("[^"]*")/g,'<span class="str">$1</span>');
  } else if (lang==="md"){
    s = s.replace(/^(#{1,6} .*)$/gm,'<span class="kw">$1</span>')
         .replace(/(`[^`]*`)/g,'<span class="str">$1</span>')
         .replace(/^(\s*[-*] )/gm,'<span class="ann">$1</span>');
  }
  return s;
}

      return `<div class="dline ${cls}"><span class="dl">${x[1]||""}</span><span class="dt">${esc(x[2])}</span></div>`;
    }).join("");
    return `<div class="dwrap"><div class="dside">
      <div class="dhalf"><div class="dhalf-head">修改前 · HEAD</div>${oldLines}</div>
      <div class="dhalf"><div class="dhalf-head">修改后 · 工作区</div>${newLines}</div>
    </div></div>`;
  }
  // 上下对比
  const rows = d.map(x=>{
    const cls = x[0]==="add" ? "add" : x[0]==="del" ? "del" : "ctx";

  return `<div class="dwrap">${rows}</div>`;
}

  // 平台下拉
  $("platMenu").innerHTML = `<div class="menu-head">平台 · ${DB.length}</div>` + DB.map(pp=>`
    <div class="opt ${pp.id===p.id?"sel":""}" data-p="${pp.id}">
      <span class="dot ${pp.cls}" style="width:17px;height:17px;font-size:9px">${pp.letter}</span>
      <span>${esc(pp.name)}<div class="meta">${esc(pp.host)}</div></span>
      <span class="meta">${pp.accounts.length} 账号</span>
    </div>`).join("");

  // 账号下拉（按平台过滤）
  $("acctMenu").innerHTML = `<div class="menu-head">${esc(p.name)} 下的账号 · ${p.accounts.length}</div>` +
    p.accounts.map(aa=>`
    <div class="opt ${aa.id===a.id?"sel":""}" data-a="${aa.id}" data-p="${p.id}">
      <span class="avatar">${esc(aa.short)}</span>
      <span>${esc(aa.label)}<div class="meta">${esc(aa.email)}</div></span>
      <span class="meta">${aa.auth==="ssh"?"SSH":"令牌"}</span>
    </div>`).join("") +
    `<div class="menu-head" style="border-top:1px solid #2b3038;margin-top:4px;padding-top:6px">+ 新增 ${esc(p.name)} 账号…</div>`;

  $("platMenu").querySelectorAll(".opt").forEach(el=>el.onclick=()=>{
    const np = el.dataset.p, first = findPlat(np).accounts[0];
    st.plat = np; st.acct = first.id;
    if (first.repos[0]) st.repo = first.repos[0].id;
    st.file = null;
    closeMenus(); renderAll(); flash(`已切到 ${findPlat(np).name}`);
  });
  $("acctMenu").querySelectorAll(".opt").forEach(el=>el.onclick=()=>{
    st.acct = el.dataset.a;
    const na = findAcct(el.dataset.p, st.acct);
    if (na.repos[0]) st.repo = na.repos[0].id;
    st.file = null;
    closeMenus(); renderAll(); flash(`已切换账号：${na.name}`);
  });

  // 内容区
  const pane = $("pane");
  pane.classList.toggle("flush", st.tab==="files");

  if (st.tab==="readme"){
    pane.innerHTML = `<div class="readme">${README[r.id] || README.default}</div>`;
  } else if (st.tab==="git"){
    pane.innerHTML = (COMMITS[r.id] || COMMITS.default).map(([h,m,au,d])=>`
      <div class="commit"><span class="h">${h}</span>
      <span class="m">${esc(m)}<small>${esc(au)}</small></span>
      <span class="d">${esc(d)}</span></div>`).join("");
  } else {
    pane.innerHTML = renderFilesPane();
    // 文件点击
    pane.querySelectorAll(".frow[data-file]").forEach(el=>el.onclick=()=>{
      st.file = el.dataset.file; renderDetail();
    });
    pane.querySelectorAll("#viewSeg button").forEach(b=>b.onclick=()=>{
      st.fileView = b.dataset.view; renderDetail();
    });
    pane.querySelectorAll("#diffSeg button").forEach(b=>b.onclick=()=>{
      st.diffMode = b.dataset.diff; renderDetail();
      termCmd(`git diff --${b.dataset.diff==="side"?"no-color":"color"} ${st.file}`);
      termOut(`diff 视图：${b.dataset.diff==="side"?"左右对比":"上下对比"}`);
    });
    $("blameBtn").onclick = ()=>{ st.blame = !st.blame; renderDetail();
      termCmd(`git blame --line-porcelain ${st.file||""} | head`);
      termOut(`Blame ${st.blame?"已开启":"已关闭"}`); };
    $("mdBtn").onclick = ()=>{ flash("Markdown 预览：README.md 已渲染"); };
    $("saveBtn").onclick = ()=>{ flash(`已保存 ${st.file}`); termCmd(`git add ${st.file||""}`); termOut("已暂存"); };
  }

  $("warnline").innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 9v5"/></svg>
    <span>写入范围：仅 <span class="mono">${esc(r.path)}/.git/config</span>，不改动 <span class="mono">~/.gitconfig</span>。姓名邮箱继承账号默认值。</span>`;
}

function renderAll(){ renderTree(); renderProjects(); renderDetail(); }

/* ================= 交互 ================= */
function closeMenus(){
  document.querySelectorAll(".menu").forEach(m=>m.classList.remove("show"));
  document.querySelectorAll(".sel-t").forEach(t=>t.classList.remove("open"));
}
document.querySelectorAll(".sel-t").forEach(t=>{
  t.onclick = (e)=>{
    e.stopPropagation();
    const menu = $(t.dataset.menu), was = menu.classList.contains("show");
    closeMenus();
    if (!was){ menu.classList.add("show"); t.classList.add("open"); }
  };
});
document.body.onclick = ()=>closeMenus();

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on", x===t));
  st.tab = t.dataset.tab;
  if (st.tab==="files") st.file = st.file || null;
  renderDetail();
});

$("authSeg").onclick = (e)=>{
  if (!e.target.dataset.auth) return;
  const f = findRepo(); f.acct.auth = e.target.dataset.auth;
  renderAll();
  termCmd(`git config --local core.sshCommand "${f.acct.auth==="ssh"?"ssh -i "+f.acct.key:"使用令牌凭据"}"`);
  termOut(`认证方式：${f.acct.auth==="ssh"?"SSH 密钥":"令牌"}`);
  flash(f.acct.auth==="token" ? "认证方式：令牌" : "认证方式：SSH 密钥");
};

/* git 操作 */
document.querySelectorAll("[data-act]").forEach(el=>el.onclick=()=>{
  const act = el.dataset.act, f = findRepo(), n = fileList(f.repo.id).length;
  const map = {
    fetch:[`git fetch --all --prune`, "远程分支已更新"],
    pull:[`git pull --rebase origin ${f.repo.branch}`, `已从 origin/${f.repo.branch} 拉取`],
    push:[`git push origin ${f.repo.branch}`, `已推送 ${f.repo.ahead||0} 个提交到 origin/${f.repo.branch}`],
    commit:[`git commit -m "..."`, `已提交 ${n} 个文件变更`],
    stash:[`git stash push -u`, "工作区已贮藏"],
    branch:[`git branch -a`, `* ${f.repo.branch}\n  remotes/origin/${f.repo.branch}\n  remotes/origin/develop`],
    merge:[`git merge --no-ff origin/develop`, "合并完成，无冲突"],
    rebase:[`git rebase -i origin/${f.repo.branch}`, "变基完成"],
    reset:[`git reset --mixed HEAD~1`, "已回退到 HEAD~1（保留工作区改动）"],
    tag:[`git tag --list`, "v1.2.0\nv1.3.0"],
    log:[`git log --oneline -5`, COMMITS[f.repo.id]?.slice(0,5).map(c=>`${c[0]} ${c[1]}`).join("\n") || "no commits"],
    test:[`ssh -T git@${findPlat(f.plat.id).host}`, "认证通过 · 连接正常"],
    apply:[`git config --local user.name "${f.acct.name}"\ngit config --local user.email "${f.acct.email}"`, `已写入 ${f.repo.path}/.git/config`],
  };
  const [cmd, out] = map[act] || ["git status", "ok"];
  termCmd(cmd.split("\n")[0]);
  out.split("\n").forEach(l=>termOut(l));
  if (act==="apply") flash(`已写入 ${f.repo.path}/.git/config`);
  else if (act==="test") flash("认证可用 · 连接已通过");
  else flash(`${el.textContent.trim()} 完成`);
});

$("branchBtn").onclick = ()=>{
  const f = findRepo();
  termCmd(`git branch -a`); termOut(`* ${f.repo.branch}\n  remotes/origin/${f.repo.branch}`);
  flash("分支列表见终端");
};
$("cloneBtn").onclick = ()=>{ termCmd("git clone …"); termOut("选择目标目录后开始克隆"); flash("克隆：选择目标目录…"); };

/* 终端 */
document.querySelectorAll(".term-tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".term-tab").forEach(x=>x.classList.toggle("on", x===t));
  st.termTab = t.dataset.tt;
  if (st.termTab==="problems") $("termBody").innerHTML = `<div class="out">没有发现问题。</div>`;
  else if (st.termTab==="output") $("termBody").innerHTML = `<div class="out">[git] 已就绪\n[git] core.sshCommand 注入完成\n[git] credential.helper = osxkeychain</div>`;
  else renderTerm();
});
$("termToggle").onclick = ()=>{
  st.termOpen = !st.termOpen;
  $("term").classList.toggle("collapsed", !st.termOpen);
  $("termToggle").textContent = st.termOpen ? "收起" : "展开";
};

let tt;
function flash(msg, bad=false){
  const el = $("toast");
  $("toastText").textContent = msg;
  el.style.color = bad ? "#e8a1a1" : "#46c88b";
  el.classList.add("show");
  clearTimeout(tt); tt = setTimeout(()=>el.classList.remove("show"), 2400);
}

/* ================= 启动 ================= */
termCmd("git status -sb");
termOut("## main...origin/main [ahead 2]");
termOut(" M src/main/java/com/example/gateway/MqttBrokerConfig.java");
termOut(" A src/main/java/com/example/gateway/DeviceAuthService.java");
termOut(" M pom.xml");
termOut(" M README.md");
termOut("已加载 iot-gateway · 身份：张鑫宇 <429092941@qq.com>", "ok");
renderAll();
</script>
</body>
