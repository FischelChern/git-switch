<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>GitSwitch 原型 v4</title>
<style>
  :root{
    --bg:#14161a; --cell:#1b1e24; --cell2:#21252d; --line:#2b3038;
    --text:#e6e8ec; --muted:#8b93a1; --dim:#656d7b;
    --accent:#5b9dff; --accent-soft:rgba(91,157,255,.14);
    --ok:#46c88b; --warn:#e0a33e; --red:#ff5c74; --add:#3fbf7f; --del:#e8607a;
    --code-font:"SF Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);overflow:hidden;
    font:13px/1.5 -apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  .win{height:100vh;display:grid;grid-template-rows:46px 1fr auto}

  /* 顶栏 */
  header{display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#1a1e25,#171a20)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;flex:none}
  .logo{width:21px;height:21px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent),#7d6bff);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 6px 16px -6px var(--accent)}
  .logo svg{width:12px;height:12px}
  .search{position:relative;width:240px;flex:none}
  .search input{width:100%;height:28px;padding:0 9px 0 27px;border-radius:8px;background:#12151a;border:1px solid var(--line);color:var(--text);font-size:12.5px;outline:none}
  .search input:focus{border-color:#3d6ea8;box-shadow:0 0 0 3px var(--accent-soft)}
  .search svg{position:absolute;left:8px;top:8px;width:13px;height:13px;opacity:.45}
  .spacer{flex:1}
  .btn{height:28px;padding:0 11px;border-radius:8px;cursor:pointer;font-size:12.5px;white-space:nowrap;flex:none;
    border:1px solid var(--line);background:var(--cell2);color:var(--text);display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:#272c35}
  .btn.primary{background:linear-gradient(180deg,#3f81e8,#2f6dd0);border-color:#2b62bd}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.sm{height:24px;padding:0 8px;font-size:11.5px;border-radius:6px}
  .btn.wide{width:100%;justify-content:center;height:32px}
  .btn.tiny{height:21px;padding:0 7px;font-size:11px;border-radius:5px}

  /* 三栏 */
  .cols{display:grid;grid-template-columns:256px 282px minmax(0,1fr);min-height:0}
  .col{display:flex;flex-direction:column;min-height:0;min-width:0}
  .platforms{border-right:1px solid var(--line);background:linear-gradient(180deg,#171a20,#15181d)}
  .projects{border-right:1px solid var(--line);background:#16191f}
  .col-head{height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);flex:none}
  .col-head .n{color:var(--muted);text-transform:none;letter-spacing:0;font-size:10.5px}
  .col-foot{border-top:1px solid var(--line);padding:9px;flex:none;display:flex;gap:6px}
  .ghost{flex:1;height:32px;border-radius:8px;cursor:pointer;font-size:12.5px;background:transparent;border:1px dashed #333a45;color:var(--muted)}
  .ghost:hover{border-color:#4a5464;color:var(--text)}
  .scroll{overflow:auto;flex:1;min-height:0;padding:6px 8px}

  /* 平台树 */
  .plat-row{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12.5px}
  .plat-row:hover{background:#1e232a}
  .plat-row.open{background:#1a1e25}
  .caret-s{width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-top:4.5px solid #7b8496;transition:transform .15s;flex:none}
  .caret-s.open{transform:rotate(180deg)}
  .badge{font-size:10.5px;color:var(--dim);white-space:nowrap}
  .acct-row{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:6px 8px 6px 14px;border-radius:8px;cursor:pointer;font-size:12.5px}
  .acct-row:hover{background:#1e232a}
  .acct-row.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 1px #31587f}
  .avatar{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:600;background:#2c3f5c;color:#b9d2f5;border:1px solid #3b5d86;flex:none}
  .acct-label{display:flex;flex-direction:column;min-width:0}
  .acct-label small{font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:9.5px;font-weight:700;flex:none}
  .dot.gh{background:#2c3138;color:#fff}
  .dot.corp{background:#4a5f8a;color:#fff}
  .dot.gitee{background:#c71d23;color:#fff}

  /* 中栏 */
  .plist{padding:8px;display:flex;flex-direction:column;gap:6px}
  .pcard{border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;background:linear-gradient(180deg,#1c2027,#1a1e24)}
  .pcard:hover{border-color:#39414f}
  .pcard.sel{border-color:#3d6ea8;box-shadow:0 0 0 2px var(--accent-soft)}
  .pcard .pn{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
  .pcard .pu{font-size:10.5px;color:var(--dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pcard .pmeta{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;align-items:center}
  .chip{font-size:10px;padding:1px 6px;border-radius:20px;background:#23282f;color:var(--muted);border:1px solid var(--line)}
  .chip.blue{background:var(--accent-soft);color:#9dc4ff;border-color:#31587f}
  .chip.ok{background:rgba(70,200,139,.1);color:#7fd7ac;border-color:rgba(70,200,139,.3)}
  .chip.star{background:rgba(224,163,62,.1);color:#e8c68b;border-color:rgba(224,163,62,.28)}

  /* 右栏 */
  .detail{background:#191c22}
  .dhead{padding:10px 16px 0;flex:none}
  .dtitle{display:flex;align-items:center;gap:8px;min-width:0}
  .dtitle h2{font-size:15px;margin:0;font-weight:600;white-space:nowrap}
  .tag{font-size:10.5px;padding:1.5px 7px;border-radius:20px;background:#23282f;color:var(--muted);border:1px solid var(--line);white-space:nowrap}
  .tag.blue{background:var(--accent-soft);color:#9dc4ff;border-color:#31587f}
  .mono{font-family:var(--code-font);font-size:11px;color:var(--dim)}
  .dpath{margin:4px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .repometa{display:flex;align-items:center;gap:12px;margin:7px 0 0;font-size:11.5px;color:var(--muted)}
  .repometa .m{display:inline-flex;align-items:center;gap:4px}
  .repometa svg{width:12px;height:12px;opacity:.75}
  .repometa b{color:#cdd6e3;font-weight:600}

  .switcher{display:grid;grid-template-columns:1fr 1.4fr auto;gap:10px;align-items:end;padding:10px 16px 8px;flex:none}
  .label{font-size:10px;color:var(--dim);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
  .combo{position:relative}
  .sel-t{height:30px;width:100%;padding:0 9px;border-radius:8px;background:#12151a;border:1px solid var(--line);color:var(--text);font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .sel-t.click{cursor:pointer}
  .sel-t.click:hover{border-color:#3a4250}
  .sel-t.open{border-color:#3d6ea8;box-shadow:0 0 0 3px var(--accent-soft)}
  .sel-t.locked{background:#171a1f;color:var(--dim);border-style:dashed;cursor:not-allowed}
  .sel-t.locked .lockic{width:11px;height:11px;opacity:.7;flex:none}
  .caret{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #7b8496;transition:transform .15s;flex:none}
  .sel-t.open .caret{transform:rotate(180deg)}
  .menu{position:absolute;z-index:40;left:0;right:0;top:35px;display:none;background:#202530;border:1px solid #333a48;border-radius:9px;padding:5px;box-shadow:0 18px 40px -12px #000}
  .menu.show{display:block;animation:pop .12s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .opt{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12.5px}
  .opt:hover{background:#2a3040}
  .opt.sel{background:var(--accent-soft)}
  .opt .meta{font-size:10px;color:var(--dim)}
  .menu-head{font-size:10px;color:var(--dim);padding:3px 8px 5px}
  .seg{display:inline-flex;background:#12151a;border:1px solid var(--line);border-radius:8px;padding:2px}
  .seg button{height:24px;padding:0 10px;border:0;border-radius:6px;cursor:pointer;background:transparent;color:var(--muted);font-size:11.5px;white-space:nowrap}
  .seg button.on{background:#2a3140;color:#dfe7f5;box-shadow:inset 0 0 0 1px #3a4453}

  /* 项目级覆盖 */
  .override{display:flex;align-items:center;gap:8px;padding:0 16px 8px;flex:none;flex-wrap:wrap}
  .override .ovlabel{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .override input.ovin{height:26px;padding:0 8px;border-radius:7px;background:#12151a;border:1px solid var(--line);
    color:var(--text);font-size:11.5px;outline:none;min-width:0;flex:1 1 150px}
  .override input.ovin:disabled{background:#171a1f;color:var(--dim);border-style:dashed}
  .override input.ovin:focus{border-color:#3d6ea8;box-shadow:0 0 0 3px var(--accent-soft)}
  .override .ovhint{font-size:10.5px;color:var(--dim);white-space:nowrap}
  .override .ovhint.on{color:var(--ok)}

  /* git 操作栏 */
  .gitbar{display:flex;align-items:center;gap:5px;padding:0 16px 8px;flex:none;flex-wrap:wrap}
  .gitbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .gitbar .branch{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:#12151a;border:1px solid var(--line);font-size:11.5px;color:#cfe0ff;cursor:pointer}
  .gitbar .branch svg{width:11px;height:11px;opacity:.7}

  /* tabs */
  .tabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line);flex:none}
  .tab{padding:8px 12px;font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tab:hover{color:var(--text)}
  .tab.on{color:#cfe0ff;border-bottom-color:var(--accent)}
  .tab .cnt{font-size:10px;padding:0 5px;border-radius:20px;background:#2b3038;color:var(--muted);margin-left:5px}

  .pane{overflow:auto;flex:1;min-height:0;padding:14px 16px 16px}
  .pane.flush{padding:0;overflow:hidden;display:flex}

  /* README */
  .readme h3{font-size:13px;margin:16px 0 6px;color:#dbe4f3}
  .readme h3:first-child{margin-top:0}
  .readme p{margin:6px 0;color:#b9c1cf;font-size:12.5px;line-height:1.75}
  .readme code{font-family:var(--code-font);font-size:11.5px;background:#23282f;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:#cbd6e6}
  .readme pre{background:#12151a;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-family:var(--code-font);font-size:11.5px;color:#a9b6c9;overflow:auto;margin:8px 0}
  .readme ul{margin:6px 0;padding-left:18px;color:#b9c1cf;font-size:12.5px}
  .readme li{margin:3px 0}

  /* ===== git 树 ===== */
  .gitview{display:flex;flex-direction:column;gap:10px}
  .branchbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 0 10px;border-bottom:1px solid var(--line)}
  .bgroup{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .bgroup .glabel{font-size:10px;color:var(--dim);letter-spacing:.5px;text-transform:uppercase;margin-right:2px}
  .bchip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;cursor:pointer;
    background:#1d222a;border:1px solid var(--line);color:#c3ccda}
  .bchip:hover{border-color:#3d6ea8}
  .bchip.cur{background:var(--accent-soft);border-color:#31587f;color:#cfe0ff}
  .bchip .bic{width:9px;height:9px;opacity:.7}
  .bchip .lane-dot{width:6px;height:6px;border-radius:50%;flex:none}

  .graphwrap{position:relative;overflow:auto;flex:1;min-height:0}
  .grow{display:grid;grid-template-columns:var(--graph-w,60px) 70px 1fr 92px;gap:9px;align-items:center;
    height:38px;cursor:pointer;border-radius:6px;padding-right:8px}
  .grow:hover{background:#1e232a}
  .grow.sel{background:#233043}
  .gsvg{position:relative}
  .gsvg svg{display:block}
  .ghash{font-family:var(--code-font);font-size:10.5px;color:#7f8ea3}
  .gmsg{font-size:12.5px;color:#dbe1ea;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
  .gmsg .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grefs{display:flex;gap:5px;overflow:hidden;flex-wrap:nowrap}
  .ref{font-size:9.5px;padding:0 5px;border-radius:4px;border:1px solid;white-space:nowrap;flex:none;font-family:var(--code-font)}
  .ref.head{color:#7fd7ac;background:rgba(70,200,139,.12);border-color:rgba(70,200,139,.35)}
  .ref.local{color:#9dc4ff;background:var(--accent-soft);border-color:#31587f}
  .ref.remote{color:#c3a7ff;background:rgba(157,139,255,.12);border-color:rgba(157,139,255,.35)}
  .ref.tag{color:#e8c68b;background:rgba(224,163,62,.1);border-color:rgba(224,163,62,.3)}
  .gmeta{font-size:10.5px;color:var(--dim);white-space:nowrap;display:flex;gap:8px;align-items:center}

  /* 本地文件 */
  .fview{display:grid;grid-template-columns:214px minmax(0,1fr);flex:1;min-height:0}
  .ftree{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#171a20}
  .ftree-head{padding:7px 10px;font-size:10.5px;color:var(--dim);letter-spacing:.6px;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
  .ftree-body{overflow:auto;flex:1;min-height:0;padding:5px 6px}
  .frow{display:grid;grid-template-columns:13px 1fr auto;gap:6px;align-items:center;padding:4px 6px 4px calc(6px + var(--ind,0px));border-radius:6px;cursor:pointer;font-size:12px;color:#c3ccda}
  .frow:hover{background:#1f242b}
  .frow.sel{background:#233043;color:#dbe9ff}
  .frow .fic{width:12px;height:12px;opacity:.5;flex:none}
  .frow.dir{color:#9dc4ff}
  .frow .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st{font-size:9.5px;font-weight:700;width:13px;text-align:center;border-radius:3px;font-family:ui-monospace,monospace}
  .st.M{color:#e0a33e}
  .st.A{color:#46c88b}
  .st.D{color:#e8607a}
  .st.R{color:#9d8bff}
  .st.U{color:#5b9dff}

  .fmain{display:flex;flex-direction:column;min-width:0;min-height:0}
  .fbar{display:flex;align-items:center;gap:6px;padding:5px 10px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;min-height:35px}
  .fbar .fpath{font-size:12px;color:#cdd6e3;font-family:var(--code-font);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:70px}
  .stat-add{color:var(--add);font-family:var(--code-font);font-size:11px}
  .stat-del{color:var(--del);font-family:var(--code-font);font-size:11px}
  .savebadge{font-size:10.5px;color:var(--dim);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .savebadge.on{color:var(--ok)}
  .savebadge .dt{width:5px;height:5px;border-radius:50%;background:currentColor}
  .usagebadge{font-size:10.5px;color:#9dc4ff;background:var(--accent-soft);border:1px solid #31587f;border-radius:20px;padding:1px 7px;white-space:nowrap}
  .errbadge{font-size:10.5px;color:#ff9aab;background:rgba(255,92,116,.14);border:1px solid rgba(255,92,116,.4);border-radius:20px;padding:1px 7px;white-space:nowrap;cursor:pointer}

  /* 编辑器 */
  .editor{display:grid;grid-template-columns:var(--gut-w,154px) minmax(0,1fr);flex:1;min-height:0;position:relative}
  .egutter{overflow:hidden;border-right:1px solid #23282f;background:#16191e;position:relative}
  .egutter-in{position:absolute;top:0;left:0;right:0;padding:6px 0;will-change:transform}
  .erow{display:grid;grid-template-columns:1fr 34px 12px;align-items:center;height:20px;line-height:20px;font-family:var(--code-font);font-size:11px;white-space:nowrap}
  .erow .blame{color:#5d6675;font-size:10px;padding-left:8px;overflow:hidden;text-overflow:ellipsis}
  .erow .ln{color:#4d5563;text-align:right;padding-right:6px;user-select:none}
  .erow .emark{color:var(--red);font-size:9px;text-align:center;visibility:hidden}
  .erow.err .emark{visibility:visible}
  .erow.err .ln{color:var(--red)}

  .elayers{position:relative;overflow:hidden;min-width:0}
  .ehl{position:absolute;top:0;left:0;margin:0;padding:6px 0;pointer-events:none;will-change:transform;
    font-family:var(--code-font);font-size:11.5px;line-height:20px;white-space:pre;color:#c9d4e4}
  .ehl .pl{display:block;height:20px;line-height:20px;padding:0 14px 0 10px;white-space:pre}
  .ehl .pl.errline{background:rgba(255,92,116,.09);box-shadow:inset 2px 0 0 var(--red)}
  .ehl .kw{color:#c792ea}
  .ehl .str{color:#a8d08d}
  .ehl .cm{color:#5c6674;font-style:italic}
  .ehl .num{color:#e0a33e}
  .ehl .ann{color:#7fb2ff}
  .ehl mark.use{background:rgba(91,157,255,.24);border-radius:2px;color:inherit}
  .ecode{position:absolute;inset:0;width:100%;height:100%;border:0;outline:none;resize:none;background:transparent;
    color:transparent;caret-color:#cfe0ff;padding:6px 14px 6px 10px;
    font-family:var(--code-font);font-size:11.5px;line-height:20px;white-space:pre;overflow:auto;tab-size:4}
  .ecode::selection{background:rgba(91,157,255,.3);color:transparent}

  /* diff */
  .dwrap{overflow:auto;flex:1;min-height:0;font-family:var(--code-font);font-size:11.5px;line-height:20px}
  .dside{display:grid;grid-template-columns:1fr 1fr}
  .dhalf{border-right:1px solid var(--line);min-width:0}
  .dhalf:last-child{border-right:0}
  .dhalf-head{position:sticky;top:0;background:#1d222a;border-bottom:1px solid var(--line);padding:4px 10px;font-size:10.5px;color:var(--muted);z-index:2}
  .dline{display:grid;grid-template-columns:44px 1fr;white-space:pre}
  .dline .dl{color:#4d5563;text-align:right;padding-right:8px;user-select:none}
  .dline .dt{padding-right:12px;color:#c9d4e4}
  .dline.add{background:rgba(63,191,127,.1)}
  .dline.add .dt{color:#a8e6c4}
  .dline.del{background:rgba(232,96,122,.1)}
  .dline.del .dt{color:#f0b3c0}

  /* PR */
  .pr{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px;background:linear-gradient(180deg,#1c2027,#1a1e24)}
  .pr .prt{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
  .pr .prn{font-family:ui-monospace,monospace;font-size:10.5px;color:#7f8ea3}
  .pr .prs{font-size:11.5px;color:var(--dim);margin-top:4px}
  .pr .pra{display:flex;gap:6px;margin-top:8px;align-items:center}
  .prstate{font-size:10px;padding:1px 6px;border-radius:20px;border:1px solid}
  .prstate.open{color:#7fd7ac;border-color:rgba(70,200,139,.35);background:rgba(70,200,139,.1)}
  .prstate.merged{color:#c3a7ff;border-color:rgba(157,139,255,.35);background:rgba(157,139,255,.12)}
  .prstate.draft{color:#c9b184;border-color:#4a3f2c;background:rgba(224,163,62,.1)}

  /* 终端 */
  .term{border-top:1px solid var(--line);background:#14171c;display:flex;flex-direction:column;height:150px;transition:height .12s ease}
  .term.collapsed{height:33px}
  .term-head{display:flex;align-items:center;gap:3px;padding:0 10px;height:32px;flex:none;border-bottom:1px solid var(--line)}

/* ================= 语法高亮 / 检查 ================= */
function hlLine(text, lang, usage){
  let s = esc(text);
  if (lang==="java"){
    s = s.replace(/(\/\/[^\n]*)/g,'<span class="cm">$1</span>')
         .replace(/("[^"]*")/g,'<span class="str">$1</span>')
         .replace(/\b(package|import|public|private|protected|class|return|new|void|int|long|boolean|final|if|else|static)\b/g,'<span class="kw">$1</span>')
         .replace(/\b(\d+)\b/g,'<span class="num">$1</span>')
         .replace(/(@\w+)/g,'<span class="ann">$1</span>');
  } else if (lang==="xml"){
    s = s.replace(/(&lt;\/?[\w:.-]+)/g,'<span class="kw">$1</span>')
         .replace(/("[^"]*")/g,'<span class="str">$1</span>');
  } else if (lang==="md"){
    s = s.replace(/^(#{1,6} .*)$/g,'<span class="kw">$1</span>')
         .replace(/(`[^`]*`)/g,'<span class="str">$1</span>')
         .replace(/^(\s*[-*] )/g,'<span class="ann">$1</span>');
  }
  if (usage){
    const re = new RegExp("\\b"+usage.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","g");
    s = s.replace(re, m=>`<mark class="use">${m}</mark>`);
  }
  return s || " ";
}

function checkSyntax(text, lang){
  const lines = text.split("\n");
  const errs = [];
  let braces=0, parens=0;
  lines.forEach((line,i)=>{
    const code = line.replace(/\/\/.*$/,"").replace(/"(?:[^"\\]|\\.)*"/g,'""');
    const ob=(code.match(/{/g)||[]).length, cb=(code.match(/}/g)||[]).length;
    const op=(code.match(/\(/g)||[]).length, cp=(code.match(/\)/g)||[]).length;
    if (lang!=="java") return;
    braces += ob-cb; parens += op-cp;
    if (braces < 0){ errs.push({ line:i, msg:"多余的 '}'" }); braces = 0; }
    if (parens < 0){ errs.push({ line:i, msg:"多余的 ')'" }); parens = 0; }
  });
  if (lang==="java" && parens>0) errs.push({ line:lines.length-1, msg:`括号未闭合（缺 ${parens} 个 ')'）` });
  if (lang==="java" && braces>0) errs.push({ line:lines.length-1, msg:`花括号未闭合（缺 ${braces} 个 '}'）` });
  return errs;
}

/* ================= git 树（分支图） ================= */
const ROW_H = 38, LANE_W = 18, PAD = 8;

function buildGraph(commits){
  const lanes = [];
  const rows = [];
  for (const c of commits){
    const before = lanes.slice();
    let lane = lanes.indexOf(c.h);
    if (lane === -1){
      lane = lanes.indexOf(null);
      if (lane === -1){ lane = lanes.length; lanes.push(null); }
    }
    for (let i=0;i<lanes.length;i++) if (i!==lane && lanes[i]===c.h) lanes[i] = null;
    lanes[lane] = c.parents[0] || null;
    const pl = [];
    if (c.parents[0]) pl.push(lane);
    for (let k=1;k<c.parents.length;k++){
      let l = lanes.indexOf(c.parents[k]);
      if (l === -1){
        l = lanes.indexOf(null);
        if (l === -1){ l = lanes.length; lanes.push(null); }
        lanes[l] = c.parents[k];
      }
      pl.push(l);
    }
    rows.push({ c, lane, before, after: lanes.slice(), pl });
  }
  const laneCount = Math.max(1, ...rows.map(r=>Math.max(r.before.length, r.after.length, r.lane+1)));
  return { rows, laneCount };
}

function graphSvg(row, laneCount){
  const W = laneCount * LANE_W + PAD*2, H = ROW_H, mid = H/2;
  const x = (l)=> PAD + l*LANE_W + LANE_W/2;
  const col = (l)=> LANE_COLORS[l % LANE_COLORS.length];
  let seg = "";

  // 贯穿线
  for (let l=0;l<laneCount;l++){
    const inB = row.before[l] ?? null, outA = row.after[l] ?? null;
    if (l === row.lane) continue;
    if (inB && outA) seg += `<line x1="${x(l)}" y1="0" x2="${x(l)}" y2="${H}" stroke="${col(l)}" stroke-width="1.6" opacity=".85"/>`;
  }
  // 汇入本提交的侧分支
  for (let l=0;l<laneCount;l++){
    if (l === row.lane) continue;
    const inB = row.before[l] ?? null, outA = row.after[l] ?? null;
    if (inB && !outA){
      seg += `<path d="M ${x(l)} 0 C ${x(l)} ${mid*0.6}, ${x(row.lane)} ${mid*0.4}, ${x(row.lane)} ${mid}" fill="none" stroke="${col(l)}" stroke-width="1.6" opacity=".9"/>`;
    }
  }
  // 本提交纵向
  const inOwn = (row.before[row.lane] ?? null) !== null;
  if (inOwn) seg += `<line x1="${x(row.lane)}" y1="0" x2="${x(row.lane)}" y2="${mid}" stroke="${col(row.lane)}" stroke-width="1.8"/>`;
  // 到父提交
  row.pl.forEach((p,idx)=>{
    if (idx===0 && p===row.lane){
      seg += `<line x1="${x(p)}" y1="${mid}" x2="${x(p)}" y2="${H}" stroke="${col(p)}" stroke-width="1.8"/>`;
    } else {
      seg += `<path d="M ${x(row.lane)} ${mid} C ${x(row.lane)} ${mid*1.5}, ${x(p)} ${mid*1.4}, ${x(p)} ${H}" fill="none" stroke="${col(p)}" stroke-width="1.6" opacity=".9"/>`;
    }
  });
  // 提交点
  seg += `<circle cx="${x(row.lane)}" cy="${mid}" r="4.2" fill="#191c22" stroke="${col(row.lane)}" stroke-width="2"/>`;
  if (row.c.parents.length > 1) seg += `<circle cx="${x(row.lane)}" cy="${mid}" r="1.8" fill="${col(row.lane)}"/>`;

  return `<svg width="${W}" height="${H}">${seg}</svg>`;
}

function renderGitPane(){
  const r = findRepo().repo;
  const br = branchesOf(r.id);
  const commits = commitsOf(r.id);
  const { rows, laneCount } = buildGraph(commits);

  const bchip = (b, isRemote)=>{
    const c = LANE_COLORS[(b.lane||0) % LANE_COLORS.length];
    return `<span class="bchip ${b.cur?"cur":""}" data-branch="${esc(b.name)}">
      <span class="lane-dot" style="background:${c}"></span>

      ${esc(b.name)}</span>`;
  };

  const bar = `<div class="branchbar">
    <div class="bgroup"><span class="glabel">本地</span>${br.local.map(b=>bchip(b,false)).join("")}</div>
    <div class="bgroup"><span class="glabel">远程</span>${br.remote.map(b=>bchip(b,true)).join("")}</div>
    ${br.tags.length?`<div class="bgroup"><span class="glabel">标签</span>${br.tags.map(t=>`<span class="bchip">${esc(t)}</span>`).join("")}</div>`:""}
    <span class="spacer"></span>
    <span class="mono">${commits.length} 提交 · ${br.local.length} 本地分支</span>
  </div>`;

  const graphW = laneCount * LANE_W + PAD*2 + 6;
  const list = rows.map((row,i)=>`
    <div class="grow ${st.selCommit===row.c.h?"sel":""}" data-commit="${row.c.h}" style="--graph-w:${graphW}px">
      <span class="gsvg">${graphSvg(row, laneCount)}</span>

      <span class="gmsg"><span class="txt" title="${esc(row.c.msg)}">${esc(row.c.msg)}</span>

      </span>
      <span class="gmeta"><span>${esc(row.c.au)}</span><span>${esc(row.c.d)}</span></span>
    </div>`).join("");

  return `<div class="gitview">${bar}<div class="graphwrap">${list}</div></div>`;
}

  return `<div class="editor" style="--gut-w:${gutW}">
    <div class="egutter"><div class="egutter-in" id="eGut">${gutter}</div></div>
    <div class="elayers" id="eLayers">
      <div class="ehl" id="eHl">${body}</div>
      <textarea class="ecode" id="eCode" spellcheck="false" wrap="off"></textarea>
    </div>
  </div>`;
}

function attachEditor(){
  const ta = $("eCode"); if (!ta) return;
  const name = st.file;
  ta.value = textOf(name);
  const onInput = ()=>{ setText(name, ta.value); syncEditor(); scheduleSave(); };
  ta.addEventListener("input", onInput);
  ta.addEventListener("scroll", syncScroll);
  ta.addEventListener("keyup", updateUsage);
  ta.addEventListener("click", updateUsage);
  ta.addEventListener("keydown", (e)=>{
    if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="s"){ e.preventDefault(); saveNow(true); }
    if (e.key==="Tab"){
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0,s)+"    "+ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s+4;
      onInput();
    }
  });
  syncEditor();
  updateUsage();
}

function syncScroll(){
  const ta = $("eCode"); if (!ta) return;
  const hl = $("eHl"), eg = $("eGut");
  if (hl) hl.style.transform = `translate(${-ta.scrollLeft}px, ${-ta.scrollTop}px)`;
  if (eg) eg.style.transform = `translateY(${-ta.scrollTop}px)`;
}

function syncEditor(){
  const ta = $("eCode"); if (!ta) return;
  const name = st.file, lang = langOf(name);
  const lines = ta.value.split("\n");
  const errs = checkSyntax(ta.value, lang);
  const errLines = new Set(errs.map(e=>e.line));
  const fc = FILES_CONTENT[name];

  const hl = $("eHl");
  if (hl) hl.innerHTML = lines.map((ln,i)=>
    `<div class="pl ${errLines.has(i)?"errline":""}">${hlLine(ln,lang,st.usage)}</div>`).join("");

  const eg = $("eGut");
  if (eg) eg.innerHTML = lines.map((_,i)=>{
    const blame = st.blame
      ? `<span class="blame">${esc(fc?.lines[i]?.[0] || "工作区")} · ${esc(fc?.lines[i]?.[1]?.slice(0,4) || "编辑")}</span>` : "";
    return `<div class="erow ${errLines.has(i)?"err":""}">${blame}<span class="ln">${i+1}</span><span class="emark">●</span></div>`;
  }).join("");

  syncScroll();
  updateErrBadge(errs);
}

function updateErrBadge(errs){
  const list = errs || checkSyntax(textOf(st.file), langOf(st.file));
  $("probCnt").textContent = list.length;
  const b = $("errBadge");
  if (b){
    b.className = list.length ? "errbadge" : "savebadge on";
    b.textContent = list.length ? `⚠ ${list.length} 个问题` : `✓ 无问题`;
  }
}

function updateUsage(){
  const ta = $("eCode"); if (!ta) return;
  const pos = ta.selectionStart, text = ta.value;
  let s = pos, e = pos;
  while (s>0 && /[A-Za-z0-9_$]/.test(text[s-1])) s--;
  while (e<text.length && /[A-Za-z0-9_$]/.test(text[e])) e++;
  const word = text.slice(s,e);
  st.usage = /^[A-Za-z_$][A-Za-z0-9_$]{1,}$/.test(word) ? word : null;
  syncEditor();
  const ub = $("usageBadge");
  if (ub){
    if (st.usage){
      const cnt = (text.match(new RegExp("\\b"+st.usage.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","g"))||[]).length;
      ub.style.display = "";
      ub.textContent = `引用 ${st.usage} · ${cnt} 处`;
    } else ub.style.display = "none";
  }
}

let saveTimer;
function scheduleSave(){
  if (!st.autoSave){ setSaveBadge("未保存", false); return; }
  setSaveBadge("编辑中…", false);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>saveNow(false), 700);
}
function saveNow(manual){
  if (st.formatOnSave && langOf(st.file)==="java"){
    const fmt = formatJava(textOf(st.file));
    if (fmt !== textOf(st.file)){
      setText(st.file, fmt);
      const ta = $("eCode"); if (ta){ ta.value = fmt; syncEditor(); }
    }
  }
  setSaveBadge(st.autoSave ? "已自动保存" : "已保存", true);
  if (manual){
    termCmd(`git add ${st.file}`);
    termOut("已保存并暂存", "ok");
    flash(`已保存 ${st.file}`);
  }
}
function setSaveBadge(text, ok){
  const b = $("saveBadge"); if (!b) return;
  b.className = "savebadge" + (ok ? " on" : "");
  b.innerHTML = `<span class="dt"></span>${text}`;
}
function formatJava(src){
  const out = []; let ind = 0;
  for (const raw of src.split("\n")){
    const t = raw.trim();
    if (/^\}/.test(t)) ind = Math.max(0, ind-1);
    out.push(t ? "    ".repeat(ind)+t : "");
    if (/\{\s*$/.test(t)) ind++;
  }
  return out.join("\n");
}

/* ================= diff ================= */
function renderDiff(){
  const d = DIFF[st.file] || DIFF.default;
  if (st.diffMode==="side"){
    const left = d.filter(x=>x[0]!=="add").map(x=>
      `<div class="dline ${x[0]==="del"?"del":""}"><span class="dl">${x[1]||""}</span><span class="dt">${esc(x[2])}</span></div>`).join("");
    const right = d.filter(x=>x[0]!=="del").map(x=>
      `<div class="dline ${x[0]==="add"?"add":""}"><span class="dl">${x[1]||""}</span><span class="dt">${esc(x[2])}</span></div>`).join("");
    return `<div class="dwrap"><div class="dside">
      <div class="dhalf"><div class="dhalf-head">修改前 · HEAD</div>${left}</div>
      <div class="dhalf"><div class="dhalf-head">修改后 · 工作区</div>${right}</div>
    </div></div>`;
  }
  return `<div class="dwrap">${d.map(x=>{
    const cls = x[0]==="add"?"add":x[0]==="del"?"del":"";
    const mark = x[0]==="add"?"+":x[0]==="del"?"−":" ";
    return `<div class="dline ${cls}"><span class="dl">${mark}${x[1]||""}</span><span class="dt">${esc(x[2])}</span></div>`;
  }).join("")}</div>`;
}

        </div>
        <span class="savebadge ${dirty?"":"on"}" id="saveBadge"><span class="dt"></span>${dirty?"有未保存改动":"已保存"}</span>
        <span class="usagebadge" id="usageBadge" style="display:none"></span>

function parseRemote(url){
  const s = (url||"").trim();
  if (!s) return null;
  let host = "", path = "";
  const scp = s.match(/^(?:[^@\/]+@)?([^:\/]+):(.+)$/);
  const urlLike = s.match(/^[a-z][a-z0-9+.-]*:\/\/([^\/]+)\/(.+)$/i);
  if (urlLike){
    host = urlLike[1].replace(/^[^@]*@/, "").split(":")[0];
    path = urlLike[2];
  } else if (scp && !/^[a-z][a-z0-9+.-]*:\/\//i.test(s)){
    host = scp[1];
    path = scp[2];
  } else return null;
  path = path.replace(/\.git$/i, "").replace(/^\/+|\/+$/g, "");
  if (!host || !path) return null;
  const seg = path.split("/");
  return { host: host.toLowerCase(), owner: seg.slice(0,-1).join("/"), name: seg[seg.length-1], path };
}

const platByHost = (host)=>{
  if (!host) return null;
  return DB.find(p => host === p.host)
      || DB.find(p => host.endsWith("." + p.host))
      || DB.find(p => p.host.endsWith("." + host))
      || null;
};

const isCloned = (platId, name)=>REPOS.some(r=>r.plat===platId && r.name===name);

function openClone(){
  const cur = findRepo();
  let pid = cur ? cur.repo.plat : (st.plat || "github");
  let aid = cur ? cur.repo.accountId : findPlat(pid).accounts[0].id;

  const platOptions = ()=> DB.map(p=>`<option value="${p.id}" ${p.id===pid?"selected":""}>${esc(p.name)} · ${esc(p.host)}</option>`).join("");
  const acctOptions = ()=> findPlat(pid).accounts.map(a=>
    `<option value="${a.id}" ${a.id===aid?"selected":""}>${esc(a.label)} · ${authLabel(a.auth)}</option>`).join("");

  openModal(`<h3>克隆仓库</h3>
    <div class="sub">拉取到本地并绑定到指定的 git 身份，之后该项目的提交、推送都使用这个身份</div>

    <div class="mf"><label>仓库地址</label>
      <input class="min" id="cUrl" placeholder="git@github.com:owner/repo.git 或 https://github.com/owner/repo.git" />
      <div class="mhint" id="cHint">支持 SSH 与 HTTPS 两种写法</div>
    </div>

    <div class="mrow">
      <div class="mf"><label>克隆到</label>
        <div class="rowflex">
          <input class="min" id="cDir" value="~/WorkSpace" />
          <button class="btn sm" id="cPick">浏览…</button>
        </div>
        <div class="mhint" id="cTarget"></div>
      </div>
      <div class="mf"><label>目录名</label><input class="min" id="cName" placeholder="自动取仓库名" /></div>
    </div>

    <div class="mrow">
      <div class="mf"><label>平台</label><select class="msel" id="cPlat">${platOptions()}</select></div>
      <div class="mf"><label>使用的身份</label><select class="msel" id="cAcct">${acctOptions()}</select></div>
    </div>

    <div class="mf">
      <div class="rowflex">
        <button class="btn sm" id="cFetch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg>
          获取该身份参与的项目
        </button>
        <span class="mono" id="cFetchHint"></span>
      </div>
      <div class="rlist" id="cList"></div>
    </div>

    <div class="note">认证方式：SSH 使用该身份的密钥路径，HTTPS 使用钥匙串里保存的令牌。克隆完成后立即写入该项目的 <b>.git/config</b>。</div>

    <div class="mfoot">
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="cGo">克隆</button>

  const urlin = $("cUrl"), hintEl = $("cHint"), nameEl = $("cName"), dirEl = $("cDir");
  const platEl = $("cPlat"), acctEl = $("cAcct"), listEl = $("cList"), fetchHint = $("cFetchHint");

  const repaintAccts = ()=>{
    const p = findPlat(pid);
    if (!p.accounts.some(a=>a.id===aid)) aid = p.accounts[0]?.id;
    acctEl.innerHTML = acctOptions();
  };

  const targetEl = $("cTarget");
  const repaintTarget = ()=>{
    const dir = dirEl.value.trim();
    const name = nameEl.value.trim() || (parseRemote(urlin.value)?.name ?? "");
    if (!dir){ targetEl.className = "mhint warn"; targetEl.textContent = "请填写克隆到哪个目录"; return; }
    const full = dir.replace(/\/+$/,"") + "/" + (name || "<仓库名>");
    targetEl.className = "mhint mono";
    targetEl.textContent = `将克隆到 ${full}`;
  };
  dirEl.addEventListener("input", repaintTarget);
  nameEl.addEventListener("input", repaintTarget);
  const pick = $("cPick");
  if (pick) pick.onclick = ()=>{
    // 原型说明：真实实现走系统目录选择器；这里只提示交互位置

    termOut("原生目录选择器：Rust 侧需引入 rfd/tauri-dialog，当前版本先用输入框", "ok");
  };
  repaintTarget();

  const onUrl = ()=>{
    const info = parseRemote(urlin.value);
    if (!urlin.value.trim()){ hintEl.className = "mhint"; hintEl.textContent = "支持 SSH 与 HTTPS 两种写法"; return; }
    if (!info){ hintEl.className = "mhint warn"; hintEl.textContent = "无法解析，请检查格式"; return; }
    const p = platByHost(info.host);
    if (p){
      pid = p.id; platEl.value = p.id; repaintAccts();
      hintEl.className = "mhint ok";
      hintEl.textContent = `识别到 ${p.name} · ${info.owner}/${info.name}`;
    } else {
      hintEl.className = "mhint warn";
      hintEl.textContent = `未匹配到已配置平台（host: ${info.host}），请手动选择`;
    }
    if (!nameEl.value.trim() || nameEl.dataset.auto === "1"){
      nameEl.value = info.name; nameEl.dataset.auto = "1";
    }
    repaintTarget();
  };
  urlin.addEventListener("input", onUrl);
  nameEl.addEventListener("input", ()=>{ nameEl.dataset.auto = "0"; });

  platEl.addEventListener("change", ()=>{ pid = platEl.value; repaintAccts(); renderList(true); });
  acctEl.addEventListener("change", ()=>{ aid = acctEl.value; renderList(true); });

  function renderList(clear){

        ? `git@${p2.host}:${full}.git`
        : `https://${p2.host}/${full}.git`;

  $("cFetch").onclick = ()=>{

      termOut(`GET /user/repos?affiliation=owner,collaborator,organization_member`, "out");

    const info = parseRemote(urlin.value);
    if (!info){ flash("请填写有效的仓库地址"); return; }
    const p = platByHost(info.host) || findPlat(pid);
    const name = (nameEl.value.trim() || info.name).replace(/[\/\\]/g, "");
    if (!name){ flash("目录名不能为空"); return; }
    const dir = (dirEl.value.trim() || "~").replace(/\/+$/,"");
    if (isCloned(p.id, name)) { flash(`${name} 已存在于本机`); return; }

    const repo = {
      id: "r" + Date.now(), plat: p.id, accountId: aid,
      name, path: `${dir}/${name}`, url: urlin.value.trim(),
      branch: "main", ahead: 0, behind: 0, stars: 0, forks: 0, watch: 0,
    };
    REPOS.push(repo);
    closeModal();
    st.plat = p.id; st.repo = repo.id; st.file = null; st.usage = null; st.selCommit = null;
    renderAll();

    const a = findAcct(p.id, aid);
    termCmd(`git clone ${repo.url} ${repo.path}`);
    termOut(`Cloning into '${name}'... done.`);
    termOut(`git config --local user.name "${a.name}"`);
    termOut(`git config --local user.email "${a.email}"`);
    if (a.auth === "ssh") termOut(`git config --local core.sshCommand "ssh -i ${a.key}"`);
    else termOut(`git config --local credential.helper ${credHelper()}`);
    termOut(`已克隆并绑定身份：${a.label}`, "ok");
    flash(`已克隆 ${name} → ${repo.path}`);
  };
}

$("cloneBtn").onclick = ()=>openClone();

document.querySelectorAll(".term-tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".term-tab").forEach(x=>x.classList.toggle("on", x===t));
  st.termTab = t.dataset.tt;
  if (st.termTab==="problems"){
    const bad = checkSyntax(textOf(st.file), langOf(st.file));
    $("termBody").innerHTML = bad.length
      ? bad.map(e=>`<div class="er">第 ${e.line+1} 行：${esc(e.msg)}</div>`).join("")
      : `<div class="out">没有发现问题。</div>`;
  } else if (st.termTab==="output"){
    $("termBody").innerHTML = `<div class="out">[git] 已就绪\n[git] core.sshCommand 注入完成\n[git] credential.helper = osxkeychain\n[gh] 已登录：张鑫宇</div>`;
  } else renderTerm();
});
$("termToggle").onclick = ()=>{
  st.termOpen = !st.termOpen;
  $("term").classList.toggle("collapsed", !st.termOpen);
  $("termToggle").textContent = st.termOpen ? "收起" : "展开";
};

let tt;
function flash(msg){
  const el = $("toast");
  $("toastText").textContent = msg;
  el.style.color = "#46c88b";
  el.classList.add("show");
  clearTimeout(tt); tt = setTimeout(()=>el.classList.remove("show"), 2400);
}

termCmd("git status -sb");
termOut("## main...origin/main [ahead 2]");
termOut(" M src/main/java/com/example/gateway/MqttBrokerConfig.java");
termOut(" A src/main/java/com/example/gateway/DeviceAuthService.java");
termOut(" M pom.xml");
termOut("已加载 iot-gateway · 身份：张鑫宇 <429092941@qq.com>", "ok");
renderAll();
</script>
