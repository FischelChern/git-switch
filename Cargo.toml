[package]
name = "git-switch"
version = "0.1.0"
edition = "2024"
description = "跨平台的多 Git 身份切换器"
license = "MIT"
rust-version = "1.85"

[dependencies]
# GUI
eframe = "0.37.0"
egui = "0.37.0"

# 配置与序列化
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# 凭据：macOS Keychain / Windows Credential Manager / Linux Secret Service
keyring = "4.2.0"

# 路径定位
dirs = "7.0.0"

# 错误
anyhow = "1.0.105"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
